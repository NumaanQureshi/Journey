name: Journey Tests

on:
  pull_request:
    branches:
      - main
      - frontend
      - 'frontend-**'
      - 'test-release'
    paths:
      - 'frontend/**'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
      - frontend
      - 'frontend-**'
      - 'test-release'
    paths:
      - 'frontend/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_ci:
    runs-on: ubuntu-latest

    # Applies working-directory to all run commands in this job automatically
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch-${{ hashFiles('frontend/pubspec.lock') }}"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Run Tests (if present)
        run: |
          if [ -d "test" ] && compgen -G "test/**/*_test.dart" > /dev/null; then
            flutter test
          else
            echo "No test files matching '*_test.dart' found. Skipping flutter test."
          fi